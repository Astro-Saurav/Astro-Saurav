<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', 'Courier New', monospace">
  <defs>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer Frame & Background -->
  <rect x="1" y="1" width="898" height="258" rx="8" fill="#0A0E14" stroke="#1F6FEB" stroke-width="1.2"/>
  <rect x="1" y="1" width="898" height="34" rx="8" fill="#161B22"/>
  <rect x="1" y="20" width="898" height="15" fill="#161B22"/>
  
  <!-- Title bar elements -->
  <circle cx="24" cy="17" r="5" fill="#FF5F56"/>
  <circle cx="42" cy="17" r="5" fill="#FFBD2E"/>
  <circle cx="60" cy="17" r="5" fill="#27C93F"/>
  <text x="82" y="22" fill="#00FF9C" font-size="12.5" font-weight="600" letter-spacing="1.2">/// CORE TECH STACK &amp; DEVELOPER METRICS ///</text>
  <text x="868" y="22" fill="#58A6FF" font-size="11" text-anchor="end" opacity="0.8">SYSTEM NORMAL</text>

  <!-- ─── LEFT PANEL: CORE DEVELOPMENT STACK (x=35 to 440, width=405) ─── -->
  <g transform="translate(35, 56)" font-size="12">
    <text x="0" y="8" fill="#E6EDF3" font-size="13.5" font-weight="600" letter-spacing="1">CORE DEVELOPMENT STACK</text>
    <text x="0" y="25" fill="#8B949E" font-size="10.5">Primary language &amp; framework proficiencies</text>

    <!-- Python -->
    <g transform="translate(0, 48)">
      <text x="0" y="0" fill="#E6EDF3" font-weight="600" font-size="12">Python</text>
      <text x="60" y="0" fill="#8B949E" font-size="11">· Cybersecurity, AI &amp; Tooling</text>
      <text x="390" y="0" fill="#3776AB" font-weight="600" font-size="12" text-anchor="end">48%</text>
      <rect x="0" y="8" width="390" height="7" rx="3.5" fill="#161B22" stroke="#21262D" stroke-width="1"/>
      <rect x="0" y="8" width="187" height="7" rx="3.5" fill="#3776AB">
        <animate attributeName="width" from="0" to="187" dur="1.2s" fill="freeze"/>
      </rect>
    </g>

    <!-- TypeScript / JS -->
    <g transform="translate(0, 88)">
      <text x="0" y="0" fill="#E6EDF3" font-weight="600" font-size="12">TypeScript / JS</text>
      <text x="125" y="0" fill="#8B949E" font-size="11">· Next.js &amp; Full-Stack Web</text>
      <text x="390" y="0" fill="#3178C6" font-weight="600" font-size="12" text-anchor="end">28%</text>
      <rect x="0" y="8" width="390" height="7" rx="3.5" fill="#161B22" stroke="#21262D" stroke-width="1"/>
      <rect x="0" y="8" width="109" height="7" rx="3.5" fill="#3178C6">
        <animate attributeName="width" from="0" to="109" dur="1.4s" fill="freeze"/>
      </rect>
    </g>

    <!-- SQL & Prisma -->
    <g transform="translate(0, 128)">
      <text x="0" y="0" fill="#E6EDF3" font-weight="600" font-size="12">SQL &amp; Prisma</text>
      <text x="100" y="0" fill="#8B949E" font-size="11">· Relational Schemas &amp; Data Connect</text>
      <text x="390" y="0" fill="#00FF9C" font-weight="600" font-size="12" text-anchor="end">14%</text>
      <rect x="0" y="8" width="390" height="7" rx="3.5" fill="#161B22" stroke="#21262D" stroke-width="1"/>
      <rect x="0" y="8" width="55" height="7" rx="3.5" fill="#00FF9C">
        <animate attributeName="width" from="0" to="55" dur="1.6s" fill="freeze"/>
      </rect>
    </g>

    <!-- Bash -->
    <g transform="translate(0, 168)">
      <text x="0" y="0" fill="#E6EDF3" font-weight="600" font-size="12">Bash &amp; Shell</text>
      <text x="100" y="0" fill="#8B949E" font-size="11">· Linux DevOps &amp; Automation</text>
      <text x="390" y="0" fill="#FCC624" font-weight="600" font-size="12" text-anchor="end">10%</text>
      <rect x="0" y="8" width="390" height="7" rx="3.5" fill="#161B22" stroke="#21262D" stroke-width="1"/>
      <rect x="0" y="8" width="39" height="7" rx="3.5" fill="#FCC624">
        <animate attributeName="width" from="0" to="39" dur="1.8s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- Center Vertical Divider -->
  <line x1="465" y1="52" x2="465" y2="242" stroke="#1F6FEB" stroke-width="1" opacity="0.35"/>

  <!-- ─── RIGHT PANEL: PROFILE METRICS & ACHIEVEMENTS (x=490 to 865, width=375) ─── -->
  <g transform="translate(490, 56)" font-size="12">
    <text x="0" y="8" fill="#E6EDF3" font-size="13.5" font-weight="600" letter-spacing="1">PROFILE &amp; SECURITY METRICS</text>
    <text x="0" y="25" fill="#8B949E" font-size="10.5">Verified operator achievements &amp; standards</text>

    <!-- 2x2 Metric Grid -->
    
    <!-- BOX 1: Top-Left (Contributions & Activity) -->
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="182" height="65" rx="5" fill="#0D1117" stroke="#21262D" stroke-width="1.2"/>
      <text x="14" y="20" fill="#7D8590" font-size="9.5" font-weight="600" letter-spacing="0.5">GITHUB ACTIVITY</text>
      
      <!-- Glowing active dot -->
      <circle cx="164" cy="16" r="3.5" fill="#00FF9C" filter="url(#neonGlow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      
      <text x="14" y="40" fill="#00FF9C" font-size="14" font-weight="600">ACTIVE &amp; COMMITTED</text>
      <text x="14" y="55" fill="#8B949E" font-size="9.5">Consistent code deploy pipeline</text>
    </g>

    <!-- BOX 2: Top-Right (Security Standard) -->
    <g transform="translate(194, 42)">
      <rect x="0" y="0" width="182" height="65" rx="5" fill="#0D1117" stroke="#21262D" stroke-width="1.2"/>
      <text x="14" y="20" fill="#7D8590" font-size="9.5" font-weight="600" letter-spacing="0.5">SECURITY STANDARD</text>
      <circle cx="164" cy="16" r="3.5" fill="#58A6FF"/>
      <text x="14" y="40" fill="#58A6FF" font-size="14" font-weight="600">OWASP TOP 10</text>
      <text x="14" y="55" fill="#8B949E" font-size="9.5">Hardened web architecture</text>
    </g>

    <!-- BOX 3: Bottom-Left (Published Intelligence) -->
    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="182" height="65" rx="5" fill="#0D1117" stroke="#21262D" stroke-width="1.2"/>
      <text x="14" y="20" fill="#7D8590" font-size="9.5" font-weight="600" letter-spacing="0.5">PUBLISHED RESEARCH</text>
      <circle cx="164" cy="16" r="3.5" fill="#FFCA28"/>
      <text x="14" y="40" fill="#FFCA28" font-size="14" font-weight="600">IEEE XPLORE 2026</text>
      <text x="14" y="55" fill="#8B949E" font-size="9.5">Peer-reviewed research author</text>
    </g>

    <!-- BOX 4: Bottom-Right (CTF & Honors) -->
    <g transform="translate(194, 118)">
      <rect x="0" y="0" width="182" height="65" rx="5" fill="#0D1117" stroke="#21262D" stroke-width="1.2"/>
      <text x="14" y="20" fill="#7D8590" font-size="9.5" font-weight="600" letter-spacing="0.5">COMBAT HONORS</text>
      <circle cx="164" cy="16" r="3.5" fill="#00FF9C"/>
      <text x="14" y="40" fill="#00FF9C" font-size="14" font-weight="600">700+ CTF POINTS</text>
      <text x="14" y="55" fill="#8B949E" font-size="9.5">National hackathon finalist</text>
    </g>
  </g>
</svg>
