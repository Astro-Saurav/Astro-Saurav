<svg width="900" height="250" viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', 'Courier New', monospace">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer Frame & Background -->
  <rect x="1" y="1" width="898" height="248" rx="8" fill="#0A0E14" stroke="#1F6FEB" stroke-width="1.2"/>
  <rect x="1" y="1" width="898" height="32" rx="8" fill="#161B22"/>
  <rect x="1" y="20" width="898" height="13" fill="#161B22"/>
  
  <!-- Title bar elements -->
  <circle cx="22" cy="16" r="5" fill="#FF5F56"/>
  <circle cx="40" cy="16" r="5" fill="#FFBD2E"/>
  <circle cx="58" cy="16" r="5" fill="#27C93F"/>
  <text x="80" y="21" fill="#00FF9C" font-size="12" font-weight="600" letter-spacing="1.5">/// OPERATOR DEVELOPMENT TELEMETRY &amp; CODEBASE METRICS ///</text>
  <text x="875" y="21" fill="#58A6FF" font-size="11" text-anchor="end" opacity="0.8">STATUS: 100% UPTIME</text>

  <!-- ─── LEFT PANEL: LANGUAGE MATRIX (x=20 to 290) ─── -->
  <g transform="translate(20, 50)" font-size="12">
    <text x="0" y="5" fill="#E6EDF3" font-size="13" font-weight="600" letter-spacing="1">TOP LANGUAGE SPECTRUM</text>

    <!-- Python -->
    <text x="0" y="35" fill="#C9D1D9">Python (Security &amp; Tooling)</text>
    <text x="260" y="35" fill="#3776AB" font-weight="600" text-anchor="end">48.2%</text>
    <rect x="0" y="42" width="260" height="6" rx="3" fill="#161B22"/>
    <rect x="0" y="42" width="125" height="6" rx="3" fill="#3776AB">
      <animate attributeName="width" from="0" to="125" dur="1.5s" fill="freeze"/>
    </rect>

    <!-- TypeScript / JS -->
    <text x="0" y="75" fill="#C9D1D9">TypeScript / JavaScript (Next.js)</text>
    <text x="260" y="75" fill="#3178C6" font-weight="600" text-anchor="end">28.5%</text>
    <rect x="0" y="82" width="260" height="6" rx="3" fill="#161B22"/>
    <rect x="0" y="82" width="74" height="6" rx="3" fill="#3178C6">
      <animate attributeName="width" from="0" to="74" dur="1.5s" fill="freeze"/>
    </rect>

    <!-- SQL & Prisma -->
    <text x="0" y="115" fill="#C9D1D9">SQL &amp; Prisma (Data Connect)</text>
    <text x="260" y="115" fill="#00FF9C" font-weight="600" text-anchor="end">13.8%</text>
    <rect x="0" y="122" width="260" height="6" rx="3" fill="#161B22"/>
    <rect x="0" y="122" width="36" height="6" rx="3" fill="#00FF9C">
      <animate attributeName="width" from="0" to="36" dur="1.5s" fill="freeze"/>
    </rect>

    <!-- Bash -->
    <text x="0" y="155" fill="#C9D1D9">Bash &amp; Shell (Automation)</text>
    <text x="260" y="155" fill="#FCC624" font-weight="600" text-anchor="end">9.5%</text>
    <rect x="0" y="162" width="260" height="6" rx="3" fill="#161B22"/>
    <rect x="0" y="162" width="25" height="6" rx="3" fill="#FCC624">
      <animate attributeName="width" from="0" to="25" dur="1.5s" fill="freeze"/>
    </rect>
  </g>

  <!-- Vertical Separator 1 -->
  <line x1="310" y1="45" x2="310" y2="235" stroke="#1F6FEB" stroke-width="0.8" opacity="0.4"/>

  <!-- ─── CENTER PANEL: ACTIVITY WAVEFORM (x=330 to 650, width 320) ─── -->
  <g transform="translate(330, 50)" font-size="12">
    <text x="0" y="5" fill="#E6EDF3" font-size="13" font-weight="600" letter-spacing="1">CONTRIBUTION &amp; SCAN ACTIVITY</text>
    <text x="310" y="5" fill="#00FF9C" font-size="10" text-anchor="end" opacity="0.9">[LIVE THREAD]</text>

    <!-- Chart grid lines -->
    <line x1="0" y1="35" x2="310" y2="35" stroke="#30363D" stroke-width="0.5" stroke-dasharray="2,3"/>
    <line x1="0" y1="75" x2="310" y2="75" stroke="#30363D" stroke-width="0.5" stroke-dasharray="2,3"/>
    <line x1="0" y1="115" x2="310" y2="115" stroke="#30363D" stroke-width="0.5" stroke-dasharray="2,3"/>
    <line x1="0" y1="155" x2="310" y2="155" stroke="#30363D" stroke-width="0.8"/>

    <!-- Filled waveform area -->
    <path d="M0,155 L0,140 Q25,120 50,135 T100,105 T150,65 T200,90 T250,35 T310,50 L310,155 Z" fill="url(#waveGrad)"/>
    
    <!-- Glowing pulse line -->
    <path d="M0,140 Q25,120 50,135 T100,105 T150,65 T200,90 T250,35 T310,50" fill="none" stroke="#00FF9C" stroke-width="2.5" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M0,140 Q25,120 50,135 T100,105 T150,65 T200,90 T250,35 T310,50" fill="none" stroke="#E6EDF3" stroke-width="1.2"/>

    <!-- Animated pulse nodes on the graph -->
    <circle cx="150" cy="65" r="4" fill="#00E5FF" filter="url(#neonGlow)">
      <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="35" r="4" fill="#00FF9C" filter="url(#neonGlow)">
      <animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="310" cy="50" r="4.5" fill="#FFBD2E" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- X-axis tags -->
    <text x="0" y="172" fill="#8B949E" font-size="10">30 DAYS AGO</text>
    <text x="155" y="172" fill="#8B949E" font-size="10" text-anchor="middle">PEAK RECON</text>
    <text x="310" y="172" fill="#00FF9C" font-size="10" text-anchor="end">REAL-TIME</text>
  </g>

  <!-- Vertical Separator 2 -->
  <line x1="670" y1="45" x2="670" y2="235" stroke="#1F6FEB" stroke-width="0.8" opacity="0.4"/>

  <!-- ─── RIGHT PANEL: SYSTEM INTEGRITY (x=690 to 885, width 195) ─── -->
  <g transform="translate(690, 50)" font-size="12">
    <text x="0" y="5" fill="#E6EDF3" font-size="13" font-weight="600" letter-spacing="1">SYSTEM INTEGRITY</text>

    <g transform="translate(0, 25)">
      <rect x="0" y="0" width="190" height="32" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="14" fill="#8B949E" font-size="9.5" letter-spacing="0.5">CODEBASE SECURITY</text>
      <text x="10" y="26" fill="#00FF9C" font-size="11" font-weight="600">OWASP TOP 10 HARDENED</text>
    </g>

    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="190" height="32" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="14" fill="#8B949E" font-size="9.5" letter-spacing="0.5">REPOSITORIES &amp; LABS</text>
      <text x="10" y="26" fill="#58A6FF" font-size="11" font-weight="600">ACTIVE &amp; MONITORED</text>
    </g>

    <g transform="translate(0, 111)">
      <rect x="0" y="0" width="190" height="32" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="14" fill="#8B949E" font-size="9.5" letter-spacing="0.5">AUTOMATED PIPELINES</text>
      <text x="10" y="26" fill="#FFCA28" font-size="11" font-weight="600">DAST / GENKIT / PyTorch</text>
    </g>

    <g transform="translate(0, 154)">
      <rect x="0" y="0" width="190" height="28" rx="4" fill="rgba(0,255,156,0.1)" stroke="#00FF9C" stroke-width="0.8"/>
      <text x="95" y="18" fill="#00FF9C" font-size="11" font-weight="600" text-anchor="middle">✔ ZERO THIRD-PARTY DEP</text>
    </g>
  </g>
</svg>
