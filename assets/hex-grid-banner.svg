<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', 'Courier New', monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E14"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0A1420"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9C"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FF9C"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="hexGrid" width="36" height="62.352" patternUnits="userSpaceOnUse">
      <path d="M18 0 L36 10.392 L36 31.176 L18 41.568 L0 31.176 L0 10.392 Z" fill="none" stroke="#1F6FEB" stroke-width="0.4" opacity="0.18"/>
      <path d="M18 31.176 L36 41.568 L36 62.352 L18 72.744 L0 62.352 L0 41.568 Z" fill="none" stroke="#1F6FEB" stroke-width="0.4" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Outer Background & Frame -->
  <rect x="1" y="1" width="898" height="238" rx="8" fill="url(#bgGrad)" stroke="#1F6FEB" stroke-width="1.2" opacity="0.9"/>

  <!-- Infinite Hex Pattern Overlay -->
  <rect x="0" y="0" width="900" height="240" fill="url(#hexGrid)" rx="8"/>

  <!-- Animated Glowing Highlights in Hex Grid -->
  <g opacity="0.6">
    <polygon points="54,31 72,41 72,62 54,72 36,62 36,41" fill="#00FF9C" opacity="0.1">
      <animate attributeName="opacity" values="0.05;0.25;0.05" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="810,41 828,52 828,73 810,83 792,73 792,52" fill="#00E5FF" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.3;0.05" dur="4.2s" repeatCount="indefinite" begin="1s"/>
    </polygon>
    <polygon points="126,145 144,156 144,177 126,187 108,177 108,156" fill="#58A6FF" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.25;0.05" dur="3.6s" repeatCount="indefinite" begin="0.7s"/>
    </polygon>
    <polygon points="738,156 756,166 756,187 738,197 720,187 720,166" fill="#00FF9C" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.25;0.05" dur="4s" repeatCount="indefinite" begin="1.5s"/>
    </polygon>
  </g>

  <!-- Scanning Cyber Line -->
  <rect x="0" y="0" width="900" height="2" fill="#00FF9C" opacity="0">
    <animate attributeName="y" from="0" to="238" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.05;0.95;1" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Top Bar Decor -->
  <rect x="0" y="0" width="900" height="3" fill="url(#accentBlue)"/>
  
  <!-- Left Corner System Label -->
  <g transform="translate(25, 18)">
    <rect x="0" y="0" width="165" height="20" rx="3" fill="#00FF9C" opacity="0.12"/>
    <rect x="0" y="0" width="165" height="20" rx="3" fill="none" stroke="#00FF9C" stroke-width="0.8" opacity="0.6"/>
    <text x="12" y="14" font-size="10" font-weight="600" fill="#00FF9C" letter-spacing="1.5">// CLEARANCE: SIGMA-3 //</text>
  </g>

  <!-- Right Corner Version / Location Tag -->
  <text x="875" y="32" font-size="11" fill="#8B949E" opacity="0.8" text-anchor="end" letter-spacing="1">LOC :: FARIDABAD, IND  |  SYS.V 2.6</text>

  <!-- ─── CENTER HERO CONTENT (IMMEDIATELY VISIBLE, NO HIDDEN TYPING DELAYS) ─── -->
  <g transform="translate(450, 95)">
    <!-- Main Name -->
    <text x="0" y="0" font-size="48" font-weight="700" text-anchor="middle" fill="url(#neonCyan)" filter="url(#glow)" letter-spacing="5">SAURAV KUMAR</text>
    <text x="0" y="0" font-size="48" font-weight="700" text-anchor="middle" fill="url(#neonCyan)" letter-spacing="5">SAURAV KUMAR</text>

    <!-- Subtitle Role Divider & Text -->
    <line x1="-290" y1="28" x2="-230" y2="28" stroke="#1F6FEB" stroke-width="1.5" opacity="0.7"/>
    <text x="0" y="32" font-size="13" font-weight="600" text-anchor="middle" fill="#E6EDF3" letter-spacing="3">CYBERSECURITY ANALYST  ·  APPSEC  ·  FULL-STACK DEV</text>
    <line x1="230" y1="28" x2="290" y2="28" stroke="#1F6FEB" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- ─── BOTTOM HUD telemetry boxes ─── -->
  <g transform="translate(40, 160)">
    <!-- Box 1: Focus -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="260" height="52" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="20" cy="21" r="4" fill="#00FF9C" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="35" y="24" font-size="11" fill="#8B949E" letter-spacing="1">DEFENSE PROFILE</text>
      <text x="20" y="42" font-size="12.5" font-weight="600" fill="#00FF9C">Zero-Trust &amp; VAPT Architect</text>
    </g>

    <!-- Box 2: Research -->
    <g transform="translate(280, 0)">
      <rect x="0" y="0" width="260" height="52" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="20" cy="21" r="4" fill="#58A6FF" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite" begin="0.5s"/>
      </circle>
      <text x="35" y="24" font-size="11" fill="#8B949E" letter-spacing="1">RESEARCH PUBLICATION</text>
      <text x="20" y="42" font-size="12.5" font-weight="600" fill="#58A6FF">IEEE Xplore Author (2026)</text>
    </g>

    <!-- Box 3: Community & CTF -->
    <g transform="translate(560, 0)">
      <rect x="0" y="0" width="260" height="52" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="20" cy="21" r="4" fill="#FFCA28" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="3.3s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <text x="35" y="24" font-size="11" fill="#8B949E" letter-spacing="1">OPERATIONAL LEADERSHIP</text>
      <text x="20" y="42" font-size="12.5" font-weight="600" fill="#FFCA28">700+ CTF &amp; InfoSec Leader</text>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="237" width="900" height="3" fill="url(#accentBlue)"/>
</svg>
