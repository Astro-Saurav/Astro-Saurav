<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', 'Courier New', monospace">
  <defs>
    <radialGradient id="sweepGrad" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="radarClip"><circle cx="125" cy="115" r="82"/></clipPath>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer frame & Background -->
  <rect x="1" y="1" width="898" height="228" rx="8" fill="#0D1117" stroke="#1F6FEB" stroke-width="1.2"/>
  <rect x="1" y="1" width="898" height="32" rx="8" fill="#161B22"/>
  <rect x="1" y="20" width="898" height="13" fill="#161B22"/>
  <circle cx="22" cy="16" r="5" fill="#FF5F56"/>
  <circle cx="40" cy="16" r="5" fill="#FFBD2E"/>
  <circle cx="58" cy="16" r="5" fill="#27C93F"/>
  <text x="80" y="21" fill="#00FF9C" font-size="12" font-weight="600" letter-spacing="1.5">/// SOC TELEMETRY &amp; REAL-TIME IDS MONITORING ///</text>
  <text x="875" y="21" fill="#58A6FF" font-size="11" text-anchor="end" opacity="0.8">ENGINE: DEFENDRIX-DAST</text>

  <!-- ─── RADAR SECTION (LEFT: x=10 to 260) ─── -->
  <g transform="translate(5, 5)">
    <g clip-path="url(#radarClip)">
      <circle cx="125" cy="115" r="82" fill="#080C12" stroke="#1F6FEB" stroke-width="1"/>
      <circle cx="125" cy="115" r="61" fill="none" stroke="#1F6FEB" stroke-width="0.75" opacity="0.4"/>
      <circle cx="125" cy="115" r="41" fill="none" stroke="#1F6FEB" stroke-width="0.75" opacity="0.4"/>
      <circle cx="125" cy="115" r="20" fill="none" stroke="#1F6FEB" stroke-width="0.75" opacity="0.4"/>
      <line x1="43" y1="115" x2="207" y2="115" stroke="#1F6FEB" stroke-width="0.5" opacity="0.35"/>
      <line x1="125" y1="33" x2="125" y2="197" stroke="#1F6FEB" stroke-width="0.5" opacity="0.35"/>

      <!-- Rotating sweep -->
      <g>
        <path d="M125,115 L125,33 A82,82 0 0,1 197,72 Z" fill="url(#sweepGrad)">
          <animateTransform attributeName="transform" type="rotate" from="0 125 115" to="360 125 115" dur="3s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- Animated threats/blips -->
      <circle cx="95" cy="85" r="3.5" fill="#FF5F56" filter="url(#neonGlow)">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.35;0.4" dur="3s" begin="0.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="145" r="3.5" fill="#FFBD2E" filter="url(#neonGlow)">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.35;0.4" dur="3s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="170" cy="82" r="3.5" fill="#00FF9C" filter="url(#neonGlow)">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.35;0.4" dur="3s" begin="2.1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle cx="125" cy="115" r="83" fill="none" stroke="#00FF9C" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Vertical Separator 1 -->
  <line x1="250" y1="45" x2="250" y2="215" stroke="#1F6FEB" stroke-width="0.8" opacity="0.4"/>

  <!-- ─── CENTER PANEL: THREAT MITIGATION LOGS (x=270 to 620) ─── -->
  <g font-size="12.5" fill="#8B949E" transform="translate(270, 0)">
    <text x="0" y="55" fill="#E6EDF3" font-size="13.5" font-weight="600" letter-spacing="1">/// LIVE MITIGATION FEED ///</text>
    
    <g transform="translate(0, 78)">
      <text x="0" y="0" fill="#FF5F56" font-weight="600">[ALERT]</text>
      <text x="58" y="0" fill="#C9D1D9">SQLi vector @ /api/auth</text>
      <text x="270" y="0" fill="#00FF9C" font-weight="600">[BLOCKED]</text>
    </g>
    
    <g transform="translate(0, 105)">
      <text x="0" y="0" fill="#FFBD2E" font-weight="600">[WARN] </text>
      <text x="58" y="0" fill="#C9D1D9">Abnormal JWT auth attempt</text>
      <text x="270" y="0" fill="#58A6FF" font-weight="600">[PATTERNS]</text>
    </g>

    <g transform="translate(0, 132)">
      <text x="0" y="0" fill="#FF5F56" font-weight="600">[ALERT]</text>
      <text x="58" y="0" fill="#C9D1D9">XSS payload in parameter</text>
      <text x="270" y="0" fill="#00FF9C" font-weight="600">[SANITIZED]</text>
    </g>

    <g transform="translate(0, 159)">
      <text x="0" y="0" fill="#58A6FF" font-weight="600">[INFO] </text>
      <text x="58" y="0" fill="#C9D1D9">Zero-Trust perimeter scan</text>
      <text x="270" y="0" fill="#00FF9C" font-weight="600">[SECURE]</text>
    </g>

    <line x1="0" y1="178" x2="350" y2="178" stroke="#1F6FEB" stroke-width="0.5" opacity="0.3"/>
    <text x="0" y="200" fill="#00FF9C" font-size="12" font-style="italic" opacity="0.9">"Secure by design, tested by breach."</text>
  </g>

  <!-- Vertical Separator 2 -->
  <line x1="645" y1="45" x2="645" y2="215" stroke="#1F6FEB" stroke-width="0.8" opacity="0.4"/>

  <!-- ─── RIGHT PANEL: SYSTEM STATS (x=665 to 885, width=220) ─── -->
  <g transform="translate(665, 48)" font-size="12" fill="#8B949E">
    <text x="0" y="7" fill="#E6EDF3" font-size="13.5" font-weight="600" letter-spacing="1">DEFENSE METRICS</text>
    
    <!-- Metric 1 -->
    <text x="0" y="38" fill="#C9D1D9">WAF Shield</text>
    <text x="210" y="38" text-anchor="end" fill="#00FF9C" font-weight="600">ACTIVE</text>
    <rect x="0" y="44" width="210" height="5" rx="2.5" fill="#161B22"/>
    <rect x="0" y="44" width="210" height="5" rx="2.5" fill="#00FF9C" opacity="0.8"/>

    <!-- Metric 2 (No more overlap!) -->
    <text x="0" y="73" fill="#C9D1D9">Attack Surface</text>
    <text x="210" y="73" text-anchor="end" fill="#27C93F" font-weight="600">LOW (0.2%)</text>
    <rect x="0" y="79" width="210" height="5" rx="2.5" fill="#161B22"/>
    <rect x="0" y="79" width="20" height="5" rx="2.5" fill="#27C93F" opacity="0.8"/>

    <!-- Metric 3 -->
    <text x="0" y="108" fill="#C9D1D9">0-Day Tolerance</text>
    <text x="210" y="108" text-anchor="end" fill="#FF5F56" font-weight="600">0.00%</text>
    <rect x="0" y="114" width="210" height="5" rx="2.5" fill="#161B22"/>
    <rect x="0" y="114" width="210" height="5" rx="2.5" fill="#58A6FF" opacity="0.8"/>

    <!-- Metric 4 -->
    <text x="0" y="143" fill="#C9D1D9">Incident Resp</text>
    <text x="210" y="143" text-anchor="end" fill="#00FF9C" font-weight="600">AUTOMATED</text>
    <rect x="0" y="149" width="210" height="5" rx="2.5" fill="#161B22"/>
    <rect x="0" y="149" width="210" height="5" rx="2.5" fill="#00E5FF" opacity="0.8"/>
  </g>
</svg>
